spring:
  application:
    name: e-commerce-learning

  datasource:
    url: jdbc:postgresql://localhost:5432/your_DB
    username: your_username
    password: your_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: your_secret_key
  expiration: 86400000  

server:
  port: 8080